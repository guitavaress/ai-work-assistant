# Servidor de inferência llama.cpp com CUDA, otimizado para RTX 3050 Laptop 6GB.
# Sobe com: docker compose -f docker/docker-compose.yml up -d
# Requer GPU acessível no Docker do WSL (ver README, seção Requisitos).

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: wa-llm
    restart: unless-stopped
    gpus: all
    ports:
      - "8080:8080"
    volumes:
      - ${WA_MODELS_DIR:-${HOME}/.ai-work-assistant/models}:/models
    command: >
      -m /models/Qwen3.5-4B-Q4_K_M.gguf
      --alias qwen3.5-4b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      -c 8192
      --jinja

  # Modo qualidade (opcional): Qwen3.5 9B IQ4_XS inteiro na GPU (full offload).
  # Sobe com: docker compose -f docker/docker-compose.yml --profile quality up -d
  # IQ4_XS (~5.2GB) + KV q8_0 c=8192 estima ~5.8GB de VRAM — cabe nos 6144 MiB da
  # 3050 6GB com margem apertada (~300 MiB); validar com nvidia-smi na máquina alvo.
  # NÃO roda junto com o serviço `llm` (4B) nos 6GB: use um profile por vez.
  llm-quality:
    profiles: ["quality"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: wa-llm-quality
    restart: unless-stopped
    gpus: all
    ports:
      - "8081:8080"
    volumes:
      - ${WA_MODELS_DIR:-${HOME}/.ai-work-assistant/models}:/models
    command: >
      -m /models/Qwen3.5-9B-IQ4_XS.gguf
      --alias qwen3.5-9b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      -c 8192
      --jinja
